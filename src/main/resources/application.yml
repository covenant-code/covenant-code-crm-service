spring:
  application:
    name: crm-service
  profiles:
    default: dev

server:
  port: 8082
  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}          # токен от @BotFather
  default-chat-id: ${TELEGRAM_DEFAULT_CHAT_ID:}  # ID общего чата команды (необязательно)
  enabled: ${TELEGRAM_ENABLED:false}         # false по умолчанию, чтобы не ломать dev-среду
